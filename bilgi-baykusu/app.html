<title>Bilgi Baykuşu</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EC; --surface:#FFFFFF; --surface-2:#FFF1D6; --ink:#3A2E22; --ink-soft:#8A7860; --border:#F0DEC0;
    --accent:#FF8B5E; --accent-ink:#7A3B1E;
    --yellow:#FFC53D; --blue:#4FA9E8; --pink:#FF6FA0; --green:#4FBE86; --purple:#9C86E6; --teal:#33BFC4; --red:#FF6B6B;
    --shadow: 0 4px 14px rgba(120,80,30,0.10);
    --track:#F1E2C4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211A11; --surface:#2C2316; --surface-2:#392C19; --ink:#F5E9D6; --ink-soft:#C7B393; --border:#4A3B24;
      --accent:#FF9A6B; --accent-ink:#FFD9C2;
      --yellow:#FFCE5C; --blue:#6BBBEF; --pink:#FF8FB5; --green:#6BCE9B; --purple:#B29EEE; --teal:#54D1D6; --red:#FF8686;
      --shadow: 0 4px 16px rgba(0,0,0,0.35);
      --track:#453722;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211A11; --surface:#2C2316; --surface-2:#392C19; --ink:#F5E9D6; --ink-soft:#C7B393; --border:#4A3B24;
    --accent:#FF9A6B; --accent-ink:#FFD9C2;
    --yellow:#FFCE5C; --blue:#6BBBEF; --pink:#FF8FB5; --green:#6BCE9B; --purple:#B29EEE; --teal:#54D1D6; --red:#FF8686;
    --shadow: 0 4px 16px rgba(0,0,0,0.35);
    --track:#453722;
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,sans-serif; padding-inline:16px; padding-block:18px 40px; }
  h1,h2,h3,.disp{ font-family:'Baloo 2',system-ui,sans-serif; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  .wrap{ max-width:920px; margin:0 auto; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  button:focus-visible, [tabindex]:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

  /* header */
  .top{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .mascot{ font-size:44px; line-height:1; filter:drop-shadow(0 3px 4px rgba(0,0,0,0.15)); }
  .top h1{ font-size:22px; color:var(--accent-ink); }
  .top .sub{ font-size:13px; color:var(--ink-soft); font-weight:700; }
  .stat-chips{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-weight:800; font-size:13px; display:flex; align-items:center; gap:5px; box-shadow:var(--shadow); white-space:nowrap; }

  /* tabs */
  .tabbar{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 16px; font-weight:800; font-size:14px; color:var(--ink-soft); display:flex; gap:6px; align-items:center; }
  .tab.active{ background:var(--accent); color:#fff; border-color:transparent; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
  .card h2{ font-size:19px; margin-bottom:10px; }
  .muted{ color:var(--ink-soft); font-size:14px; line-height:1.5; }

  .btn{ background:var(--accent); color:#fff; border-radius:12px; padding:12px 20px; font-weight:800; font-size:15px; box-shadow:var(--shadow); }
  .btn:active{ transform:translateY(1px); }
  .btn.secondary{ background:var(--surface-2); color:var(--ink); }
  .btn.block{ width:100%; text-align:center; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }

  /* ring */
  .ring{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .ring::after{ content:attr(data-pct) '%'; width:42px; height:42px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }

  /* today task */
  .task-card{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .task-info{ flex:1; min-width:180px; }
  .task-info .lbl{ font-size:12px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .task-info .name{ font-size:19px; font-weight:800; margin-top:2px; }

  .grid-subjects{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .subj-tile{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; text-align:left; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); }
  .subj-tile .ic{ font-size:26px; }
  .subj-tile .nm{ font-weight:800; font-size:14px; }
  .bar{ height:9px; border-radius:999px; background:var(--track); overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:999px; background:var(--accent); }
  .subj-tile .pct{ font-size:12px; font-weight:700; color:var(--ink-soft); }

  .badges-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .badge{ background:var(--surface-2); border-radius:14px; padding:10px 12px; text-align:center; min-width:76px; }
  .badge .emoji{ font-size:22px; }
  .badge .nm{ font-size:11px; font-weight:800; margin-top:2px; }
  .badge.locked{ opacity:0.35; }

  /* subject detail */
  .unit-block{ margin-bottom:14px; }
  .unit-block h3{ font-size:15px; margin-bottom:8px; }
  .topics{ display:flex; flex-direction:column; gap:6px; }
  .topic-row{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:12px; padding:9px 12px; }
  .topic-row .tname{ flex:1; font-size:13.5px; font-weight:700; }
  .status-dot{ width:11px; height:11px; border-radius:50%; flex:none; }
  .status-pill{ font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; border:1px solid var(--border); background:var(--surface); white-space:nowrap; }

  /* quiz */
  .qprog{ display:flex; gap:5px; margin-bottom:14px; }
  .qprog i{ flex:1; height:6px; border-radius:999px; background:var(--track); }
  .qprog i.done{ background:var(--accent); }
  .q-text{ font-size:17px; font-weight:800; margin-bottom:14px; white-space:pre-line; }
  .opts{ display:flex; flex-direction:column; gap:9px; }
  .opt{ background:var(--surface-2); border:2px solid transparent; border-radius:13px; padding:12px 14px; font-weight:700; font-size:14.5px; text-align:left; }
  .opt.selected{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--surface-2)); }
  .opt.correct{ border-color:var(--green); background:color-mix(in srgb, var(--green) 22%, var(--surface-2)); }
  .opt.wrong{ border-color:var(--red); background:color-mix(in srgb, var(--red) 20%, var(--surface-2)); }
  .opt[disabled]{ cursor:default; }
  .text-answer{ width:100%; font-family:inherit; font-size:15px; font-weight:700; border:2px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:13px; padding:12px 14px; }
  .text-answer:focus{ outline:none; border-color:var(--accent); }
  .text-answer:disabled{ opacity:0.75; }
  .journal-box{ width:100%; min-height:80px; font-family:inherit; font-size:14px; border:2px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:13px; padding:12px 14px; resize:vertical; }
  .journal-box:focus{ outline:none; border-color:var(--accent); }
  .explain-box{ background:var(--surface-2); border-left:4px solid var(--blue); border-radius:10px; padding:12px 14px; margin-top:14px; font-size:13.5px; line-height:1.5; }

  .result-score{ font-family:'Baloo 2'; font-size:44px; text-align:center; color:var(--accent-ink); }
  .result-sub{ text-align:center; color:var(--ink-soft); font-weight:700; margin-top:-4px; }

  /* pin */
  .pinpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:16px auto 0; }
  .pinpad button{ background:var(--surface-2); border-radius:14px; padding:16px 0; font-size:19px; font-weight:800; }
  .pindots{ display:flex; gap:10px; justify-content:center; margin:16px 0; }
  .pindots i{ width:14px; height:14px; border-radius:50%; background:var(--track); display:block; }
  .pindots i.filled{ background:var(--accent); }

  .toggle-4{ display:flex; gap:5px; flex-wrap:wrap; }
  .toggle-4 button{ font-size:11px; font-weight:800; padding:5px 9px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); }
  .toggle-4 button.on{ color:#fff; border-color:transparent; }

  .timer-box{ text-align:center; padding:10px 0; }
  .timer-num{ font-family:'Baloo 2'; font-size:40px; color:var(--accent-ink); font-variant-numeric:tabular-nums; }

  .empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); }
  .empty .big{ font-size:40px; margin-bottom:8px; }

  /* rewards */
  .reward-track{ position:relative; height:14px; border-radius:999px; background:var(--track); margin:10px 0 18px; }
  .reward-track > i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--yellow),var(--accent)); }
  .reward-marks{ position:relative; height:22px; margin-top:14px; }
  .reward-mark{ position:absolute; top:0; transform:translateX(-50%); text-align:center; font-size:16px; }
  .reward-list{ display:flex; flex-direction:column; gap:8px; }
  .reward-item{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:13px; padding:10px 12px; }
  .reward-item .em{ font-size:22px; }
  .reward-item .info{ flex:1; }
  .reward-item .nm{ font-weight:800; font-size:13.5px; }
  .reward-item .cost{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .reward-item.locked{ opacity:0.55; }
  .reward-form{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .reward-form input{ font-family:inherit; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:8px 10px; font-size:13px; }
  .reward-form input[name="rname"]{ flex:2; min-width:140px; }
  .reward-form input[name="remoji"]{ width:52px; text-align:center; }
  .reward-form input[name="rcost"]{ width:80px; }
  .redeem-log{ font-size:12.5px; color:var(--ink-soft); }
  .redeem-log div{ padding:4px 0; border-bottom:1px dashed var(--border); }

  @media (max-width:480px){
    .top h1{ font-size:19px; }
    .stat-chips{ margin-left:0; width:100%; }
  }

  .confetti-container{ position:relative; height:0; overflow:visible; }
  .confetti-piece{ position:absolute; top:-16px; width:8px; height:14px; border-radius:2px; opacity:0.95; animation-name:confetti-fall; animation-timing-function:ease-in; animation-fill-mode:forwards; }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(240px) rotate(340deg); opacity:0; }
  }
  .quote-strip{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:14px; padding:12px 16px; margin-bottom:16px; font-size:13.5px; font-weight:700; font-style:italic; color:var(--ink); }
  .quote-strip .qmark{ font-size:20px; flex:none; }

  #print-report{ display:none; }
  @media print{
    #app{ display:none !important; }
    #print-report{ display:block !important; background:#fff; color:#111; }
  }
</style>

<div class="wrap" id="app">
  <div class="empty"><div class="big">🦉</div>Bilgi Baykuşu uyanıyor...</div>
</div>
<div id="print-report"></div>

<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function tierWord(level){ return level>=3?'zor':level===2?'orta':'kolay'; }

  /* ---------- sesli okuma (text-to-speech) ---------- */
  const ttsAvailable = typeof window!=='undefined' && 'speechSynthesis' in window;

  /* ---------- yapay zekâ öğretmen (Claude) ---------- */
  let sampleFn = null;              // boot sırasında claude.use('sample') ile gelir
  const aiReady = ()=> !!sampleFn;
  const TEACHER_RULES = [
    "Sen 10 yaşında, 4. sınıfa giden bir öğrenciye yardım eden sıcakkanlı bir öğretmensin. Adın Bilgi Baykuşu.",
    "Türkçe, kısa ve sade cümlelerle anlat; en fazla 140 kelime kullan.",
    "Mutlaka günlük hayattan somut bir örnek ver.",
    "Sadece okul derslerine (Türkçe, Matematik, Fen Bilimleri, Sosyal Bilgiler, İngilizce, Din Kültürü, Trafik Güvenliği) ve ders çalışmaya yardımcı konulara cevap ver.",
    "Konu dışı, yaşa uygun olmayan ya da kişisel bilgi isteyen sorularda kibarca reddet ve derslerle ilgili soru sormasını öner.",
    "Cevabın sonuna cesaretlendirici kısa bir cümle ekle.",
    "Başlık, madde işareti ya da yıldız kullanma; düz paragraf yaz."
  ].join('\n');

  function aiErrorMessage(e){
    const code = e && e.code;
    if(code==='rate_limited') return 'Çok hızlı soru sordun 🙂 Biraz bekleyip tekrar dener misin?';
    if(code==='not_granted') return 'Bu özellik için izin verilmedi.';
    if(code==='cancelled') return null;
    return 'Şu an cevap veremedim, birazdan tekrar dener misin?';
  }

  async function askTeacher(question){
    const q = String(question||'').trim();
    if(!q || !sampleFn) return;
    if(state.ai.loading) return;
    state.view = 'ask';
    state.ai = { question:q, answer:'', loading:true, error:null };
    render();
    try{
      const res = await sampleFn(TEACHER_RULES + '\n\nÖğrencinin sorusu: ' + q, {
        modelTier:'default',
        cache:false,
        onText: ({text})=>{
          state.ai.answer = text;
          state.ai.loading = false;
          const el = app.querySelector('#ai-answer');
          if(el) el.textContent = text; else render();
        }
      });
      state.ai.answer = (res && res.text) || state.ai.answer;
      state.ai.loading = false;
      render();
    }catch(e){
      state.ai.loading = false;
      if(e && e.text) state.ai.answer = e.text;
      state.ai.error = aiErrorMessage(e);
      render();
    }
  }

  // Sınav için yapay zekâ ile taze çoktan seçmeli sorular üretir; başarısız olursa boş döner.
  async function generateAIQuestions(subjectId, unitIds, tier, count){
    if(!sampleFn || !count) return [];
    const subj = SUBJECT_BY_ID[subjectId];
    if(!subj) return [];
    const unitNames = unitIds.map(id=>{ const u = subj.units.find(x=>x.id===id); return u && u.name; }).filter(Boolean);
    const prompt = [
      `4. sınıf (10 yaş) ${subj.name} dersi için ${count} adet çoktan seçmeli soru üret.`,
      unitNames.length ? `Üniteler: ${unitNames.join(' | ')}` : '',
      `Zorluk seviyesi: ${tier}`,
      'Kurallar: Türkçe; MEB 4. sınıf müfredatı seviyesinde; her soruda tam 4 farklı seçenek ve tek doğru cevap; açıklama tek cümle ve çocuğun anlayacağı dilde; sorular birbirinden farklı olsun.',
      'Yalnızca şu JSON yapısını döndür, başka hiçbir şey yazma:',
      '{"questions":[{"q":"soru metni","opts":["secenek1","secenek2","secenek3","secenek4"],"correct":0,"explain":"kisa aciklama"}]}'
    ].filter(Boolean).join('\n');
    try{
      const out = await sampleFn.json(prompt, { modelTier:'default', cache:false });
      const list = out && Array.isArray(out.questions) ? out.questions : [];
      const valid = [];
      list.forEach((item, i)=>{
        if(!item || typeof item.q!=='string' || !item.q.trim()) return;
        if(!Array.isArray(item.opts) || item.opts.length!==4) return;
        const opts = item.opts.map(o=>String(o==null?'':o).trim());
        if(opts.some(o=>!o) || new Set(opts).size!==4) return;
        const correct = Number(item.correct);
        if(!Number.isInteger(correct) || correct<0 || correct>3) return;
        valid.push({
          subjectId,
          unitId: unitIds[i % unitIds.length] || unitIds[0],
          q: item.q.trim(),
          opts,
          correct,
          explain: typeof item.explain==='string' ? item.explain.trim() : '',
          fromAI: true
        });
      });
      return valid;
    }catch(e){
      return [];
    }
  }

  // Yerel sınavı kurar, sonra mümkünse sorularının bir kısmını yapay zekâ soruları ile değiştirir.
  async function startQuiz(subjectFilter){
    const quiz = buildQuiz(subjectFilter);
    if(!quiz) return;
    if(!sampleFn || !state.useAI){ state.quiz = quiz; render(); return; }
    state.quizLoading = true;
    render();
    const targetSubject = (subjectFilter && subjectFilter!=='all')
      ? subjectFilter
      : quiz.questions[randInt(0, quiz.questions.length-1)].subjectId;
    const unitIds = [...new Set(quiz.questions.filter(q=>q.subjectId===targetSubject).map(q=>q.unitId))];
    const tier = tierWord(state.levels[targetSubject] || 1);
    const aiQuestions = await generateAIQuestions(targetSubject, unitIds.length?unitIds:[SUBJECT_BY_ID[targetSubject].units[0].id], tier, 8);
    if(aiQuestions.length){
      const replaceable = quiz.questions
        .map((q,i)=>({q,i}))
        .filter(x=>x.q.subjectId===targetSubject && x.q.type!=='yazili')
        .map(x=>x.i);
      const slots = replaceable.length ? replaceable : quiz.questions.map((_,i)=>i);
      aiQuestions.slice(0, slots.length).forEach((aiq, n)=>{ quiz.questions[slots[n]] = aiq; });
      quiz.aiCount = Math.min(aiQuestions.length, slots.length);
    }
    state.quizLoading = false;
    state.quiz = quiz;
    render();
  }
  function speak(text){
    if(!ttsAvailable || !text) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'tr-TR';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  /* ---------- mikrofonla sesli cevap (speech-to-text) ---------- */
  const SpeechRecognitionCtor = typeof window!=='undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
  const sttAvailable = !!SpeechRecognitionCtor;
  let activeRecognition = null;
  function startVoiceInput(onResult, onDone){
    if(!sttAvailable) return;
    try{
      if(activeRecognition){ activeRecognition.abort(); }
      const rec = new SpeechRecognitionCtor();
      activeRecognition = rec;
      rec.lang = 'tr-TR';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = (e)=>{ if(e.results && e.results[0] && e.results[0][0]) onResult(e.results[0][0].transcript); };
      rec.onerror = ()=>{ if(onDone) onDone(); };
      rec.onend = ()=>{ activeRecognition=null; if(onDone) onDone(); };
      rec.start();
    }catch(e){ if(onDone) onDone(); }
  }
  function normalizeAnswer(s){
    return String(s||'').toLocaleLowerCase('tr-TR').trim().replace(/\s+/g,' ').replace(/[.,!?;:'"]/g,'');
  }
  function answerIsCorrect(q, given){
    if(given==null || given==='') return false;
    if(q.type==='yazili'){
      const norm = normalizeAnswer(given);
      return (q.answers||[]).some(a=>normalizeAnswer(a)===norm);
    }
    return given===q.correct;
  }
  function correctAnswerText(q){
    return q.type==='yazili' ? (q.answers && q.answers[0]) : q.opts[q.correct];
  }

  /* ---------- curriculum data ---------- */
  const SUBJECT_COLOR = { turkce:'pink', matematik:'blue', fen:'green', sosyal:'purple', ingilizce:'yellow', din:'teal', trafik:'red' };

  const CURRICULUM = [
    { id:'turkce', name:'Türkçe', icon:'📖', units:[
      { id:'tema1', name:'1. Tema: Erdemler', topics:[ {id:'t1a',name:'Sözcükte Anlam (Gerçek-Mecaz)'}, {id:'t1b',name:'Eş ve Zıt Anlamlı Kelimeler'}, {id:'t1c',name:'Metni Anlama ve Yorumlama'} ]},
      { id:'tema2', name:'2. Tema: Millî Kültürümüz', topics:[ {id:'t2a',name:'Atasözü ve Deyimler'}, {id:'t2b',name:'Noktalama İşaretleri'}, {id:'t2c',name:'Konu ve Ana Fikir'} ]},
      { id:'tema3', name:'3. Tema: Doğa ve Evren', topics:[ {id:'t3a',name:'Sebep-Sonuç Cümleleri'}, {id:'t3b',name:'Yazım Kuralları'}, {id:'t3c',name:'Karşılaştırma Yapma'} ]},
      { id:'tema4', name:'4. Tema: Atatürk', topics:[ {id:'t4a',name:'Zaman ve Yer Bildiren Sözcükler'}, {id:'t4b',name:'Metin Türleri'}, {id:'t4c',name:'Anlatım Bozuklukları'} ]},
      { id:'tema5', name:'5. Tema: Sağlık ve Spor', topics:[ {id:'t5a',name:'İsim, Sıfat, Zamir'}, {id:'t5b',name:'Öznel-Nesnel Cümleler'}, {id:'t5c',name:'Paragrafta Anlam'} ]},

  /* ---------- topic lessons (konu anlatımı) ---------- */
  const TOPIC_LESSONS = {
    t1a:"Hadi bu konuya birlikte bakalım canım öğrencim. Bir sözcüğü kullandığımızda bazen onu tam, ilk akla gelen anlamıyla söyleriz; buna gerçek anlam denir, mesela 'sıcak çorba' dediğimizde çorbanın gerçekten sıcak olduğunu kastederiz. Bazen ise sözcüğü başka bir şeye benzeterek, dokunup hissedemeyeceğimiz bir anlamda kullanırız; buna mecaz anlam denir, mesela 'sıcak bir gülümseme' dediğimizde gülümsemenin ısısından değil, sana iyi hissettirmesinden bahsediyoruz. İpucu: cümledeki sözcüğü elinle tutup gösterebiliyorsan genelde gerçek anlamdır, gösteremiyorsan mecazdır.",
    t1b:"Şimdi sana eş ve zıt anlamlı kelimeleri anlatayım. Eş anlamlı kelimeler birbirine çok yakın, neredeyse aynı anlama gelen kelimelerdir; 'güzel' ile 'hoş' gibi. Zıt anlamlı kelimeler ise tam tersi anlama gelir; 'güzel'in zıddı 'çirkin'dir. Bir kelimenin eş ya da zıt anlamlısını bulmak istediğinde, önce o kelimenin cümlede ne anlatmak istediğini düşün, sonra ona en yakın ya da en zıt kelimeyi ara.",
    t1c:"Bir metni gerçekten anlamak iki adımda olur, hadi birlikte görelim. Önce metnin ne anlattığını, yani konusunu bulursun (mesela 'bir çocuğun okula ilk günü'). Sonra yazarın bu konuyla sana ne söylemek istediğini, yani ana fikri bulursun (mesela 'yeni bir şeye başlamak korkutucu ama güzel olabilir'). Yorumlama ise okuduklarından yola çıkarak kendi düşüncelerini eklemendir; 'Bence bu çocuk gibi ben de cesur olabilirim' demek gibi.",
    t2a:"Gel, atasözü ve deyimleri birlikte inceleyelim. Atasözleri, atalarımızdan bize kalan ve bir ders veren kısa sözlerdir; 'Damlaya damlaya göl olur' sözü, küçük ama düzenli çabaların zamanla büyük bir sonuca dönüşeceğini anlatır. Deyimler ise kelimelerin gerçek anlamından farklı, kalıplaşmış anlatım kalıplarıdır; 'ağzı kulaklarına varmak' gerçekten ağzın kulağa gitmesi değil, çok sevinmek demektir. İkisini de günlük hayatta duyduğunda anlamını çözmeye çalış, zamanla ezberlersin.",
    t2b:"Noktalama işaretlerini birlikte hatırlayalım. Düz, bilgi veren bir cümlenin sonuna nokta (.) koyarız. Bir şey sorduğumuzda cümle soru işareti (?) ile biter. Şaşırma, sevinme gibi güçlü bir duyguyu anlatan cümlelerin sonuna ünlem (!) koyarız. Cümle içinde bir şeyleri sayarken ya da ayırırken de virgül (,) kullanırız, mesela 'elma, armut ve muz aldım' cümlesinde olduğu gibi.",
    t2c:"Konu ile ana fikri karıştırmamak için şöyle düşün. Konu, metnin kısaca neyle ilgili olduğudur; tek bir kelime ya da kısa bir ifadeyle söylenebilir, mesela 'dostluk'. Ana fikir ise yazarın bu konu hakkında sana vermek istediği asıl mesajdır, daha uzun bir cümledir; mesela 'gerçek dostlar zor günde belli olur'. Bir metni okuduğunda önce 'bu ne hakkında?' diye sor, sonra 'yazar bana ne anlatmak istiyor?' diye sor.",
    t3a:"Sebep-sonuç ilişkisini birlikte öğrenelim. Bir cümlede '...dığı için', '...den dolayı' gibi ifadeler gördüğünde, bunlar sana bir olayın nedenini gösterir. 'Yağmur yağdığı için sokaklar ıslandı' cümlesinde önce yağmur yağmış (sebep), bu yüzden sokaklar ıslanmış (sonuç). Bu tür cümlelerde her zaman kendine 'neden oldu?' diye sor, cevabı sebep, geri kalanı sonuçtur.",
    t3b:"Yazım kurallarını birlikte hatırlayalım. Her cümle büyük harfle başlar. Kişi, hayvan, yer ve ülke adları gibi özel isimlerin ilk harfi her zaman büyük yazılır; 'ayşe okula gitti' değil 'Ayşe okula gitti' yazılır. Sayı ve tarihlerin yazımında da kendine özgü kurallar vardır, bunları yazarken dikkatli olmalısın.",
    t3c:"Karşılaştırma yaparken iki şeyin benzer ve farklı yanlarını anlatırız. Bunun için 'daha, en, gibi, kadar' gibi sözcükleri kullanırız; 'elma armuttan daha tatlıdır' dediğinde iki meyveyi karşılaştırmış olursun. Bir cümlede bu sözcükleri gördüğünde, orada bir karşılaştırma yapıldığını anlarsın.",
    t4a:"Zaman ve yer bildiren sözcükleri ayırt etmeyi öğrenelim. Zaman bildiren sözcükler bir şeyin ne zaman olduğunu anlatır: dün, bugün, yarın, sabah gibi. Yer bildiren sözcükler ise nerede olduğunu anlatır: okulda, evde, bahçede gibi. Bir cümle okuduğunda 'ne zaman?' sorusuna cevap veren kelimeyi bulursan zaman sözcüğünü, 'nerede?' sorusuna cevap vereni bulursan yer sözcüğünü bulmuş olursun.",
    t4b:"Metin türlerini birlikte tanıyalım. Hikâye, bir olayı başından sonuna, zaman sırasına göre anlatan bir metin türüdür. Şiir, duygu ve düşünceleri ölçülü ve kafiyeli, yani ahenkli bir dille anlatır. Tarif ise bir işin nasıl yapılacağını adım adım, sırayla anlatır; bir yemek tarifi gibi. Bir metni okuduğunda hangi amaçla yazıldığına bakarsan türünü bulabilirsin.",
    t4c:"Anlatım bozukluklarını fark etmeyi öğrenelim. Bir cümlede gereksiz sözcük kullanmak (mesela 'geri iade etti' yerine sadece 'iade etti' demek yeterlidir), anlam çelişkisi olması ya da sözcüklerin yanlış sırada olması cümleyi bozar. Yazdığın bir cümleyi sesli okuduğunda kulağına tuhaf geliyorsa, muhtemelen bir anlatım bozukluğu vardır; cümleyi tekrar düzenlemelisin.",
    t5a:"İsim, sıfat ve zamiri birbirinden ayırmayı öğrenelim. İsim, varlıklara verilen addır: kedi, İstanbul, kalem gibi. Sıfat, ismi niteler yani onun nasıl olduğunu söyler: 'kırmızı kedi' dediğinde 'kırmızı' sıfattır. Zamir ise ismin yerini tutar, ismi tekrar söylemek zorunda kalmayız: 'o, bu, ben, sen' gibi. Bir cümlede hangi sözcüğün varlığa ad olduğuna, hangisinin onu nitelediğine, hangisinin ismin yerine geçtiğine bak.",
    t5b:"Öznel ve nesnel cümleleri ayırt etmeyi öğrenelim. Nesnel cümleler kişisel görüş içermez, herkesin kabul edebileceği, kanıtlanabilir gerçekleri anlatır: 'Su 100°C'de kaynar' gibi. Öznel cümleler ise kişinin kendi düşüncesini ya da beğenisini anlatır: 'Bu film çok güzeldi' gibi, çünkü herkes aynı fikirde olmayabilir. Bir cümlenin kanıtlanıp kanıtlanamayacağını düşünürsen hangisi olduğunu bulabilirsin.",
    t5c:"Paragrafta anlamı bulmayı birlikte öğrenelim. Bir paragrafın konusunu, ana fikrini ve bu ana fikri destekleyen yardımcı fikirlerini bulmak, paragrafta anlamı kavramak demektir. Paragrafın ilk cümlesi genelde konuyu tanıtır, son cümlesi ise çoğu zaman önemli bir sonuç ya da ana fikir içerir. Bu yüzden bir paragrafı okurken ilk ve son cümleye özellikle dikkat et.",
    t6a:"Fiil, yani eylem kavramını birlikte hatırlayalım. Fiiller bir işi, hareketi ya da oluşu anlatan sözcüklerdir: koşmak, gülmek, büyümek gibi. Bir sözcüğün fiil olup olmadığını anlamak için sonuna '-mak/-mek' ekleyip anlamlı bir söz elde edip edemediğine bakabilirsin; 'koş' sözcüğüne '-mak' ekleyince 'koşmak' olur ve anlamlıdır, demek ki fiildir.",
    t6b:"Cümlenin ögelerini birlikte bulalım. Özne, cümlede işi yapan kişi ya da şeydir, 'kim/ne yaptı?' diye sorarız. Yüklem, cümlenin temelini oluşturan eylem ya da durumdur. Nesne ise eylemden etkilenen şeydir, 'neyi/kimi?' diye sorarız. 'Ali topu attı' cümlesinde: Ali özne (kim attı?), attı yüklem, topu ise nesnedir (neyi attı? topu).",
    t6c:"Duygu ve düşüncelerimizi anlatmayı birlikte konuşalım. Bir şey hissettiğimizde ya da düşündüğümüzde bunu hem konuşurken hem yazarken açık, anlaşılır ve karşımızdakine saygılı, nazik bir dille anlatmaya özen göstermeliyiz. Böylece hem kendimizi doğru ifade eder hem de başkalarıyla iyi iletişim kurarız.",
    t7a:"Bağlaçları birlikte tanıyalım. Bağlaçlar, sözcükleri ya da cümleleri birbirine bağlayan küçük ama önemli sözcüklerdir: ve, ile, ama, fakat, çünkü, hem...hem gibi. 'Koştu ve yoruldu' cümlesinde 've' iki eylemi birbirine bağlar, yani bağlaçtır. Bir cümlede iki şeyi birbirine bağlayan kelimeyi bulursan, o bağlaçtır.",
    t7b:"Grafik ve tablo okumayı birlikte öğrenelim. Grafikler, sayısal bilgileri gözümüzle kolayca görebileceğimiz şekilde gösterir. Sütun grafiğinde sütunun yüksekliği, o değerin ne kadar büyük olduğunu gösterir; en yüksek sütun en büyük değeri anlatır. Çizgi grafiğinde ise çizginin yukarı ya da aşağı gitmesi, artışı ya da azalışı gösterir. Tablo okurken de satır ve sütun başlıklarına dikkat etmelisin, çünkü hangi bilginin nereye ait olduğunu onlar söyler.",
    t7c:"Özet çıkarmayı birlikte öğrenelim. Bir metni özetlerken sadece en önemli bilgileri, kendi cümlelerinle ve olabildiğince kısa anlatırsın. Gereksiz ayrıntılar, örnekler ya da tekrarlar özete girmez; sadece metnin ana hatlarını verirsin. İyi bir özet, metni hiç okumamış biri bile okusa neyin anlatıldığını anlayabileceği kadar açık olmalıdır.",
    t8a:"Cümle çeşitlerini birlikte hatırlayalım. Cümleler anlamına göre olumlu ('Kitabı okudum'), olumsuz ('Kitabı okumadım'), soru ('Kitabı okudun mu?') ve ünlem ('Ne güzel bir kitap!') cümlesi olabilir. Yükleminin türüne göre de isim cümlesi (yüklemi isim soylu, 'Hava çok güzel') ya da fiil cümlesi (yüklemi fiil, 'Ali koştu') olabilir. Bir cümleyi okurken önce anlamına, sonra yüklemine bakarak türünü belirleyebilirsin.",
    t8b:"Yazım ve noktalama kurallarını birlikte tekrar edelim. Büyük harf kuralları, noktalama işaretleri ve yazım kurallarını hep birlikte gözden geçirmek, yazdığın metinleri hem daha doğru hem de daha anlaşılır yapar. Yazdıktan sonra metnini tekrar okuyup bu kurallara uyup uymadığını kontrol etmek çok işine yarar.",
    t8c:"Okuduğunu değerlendirmeyi birlikte konuşalım. Bir metni okuduktan sonra onu beğenip beğenmediğini, neden öyle düşündüğünü ve bu metinden ne öğrendiğini kendi cümlelerinle anlatmaya çalış. Bu, sadece okumakla kalmayıp okuduğun üzerine düşünmeni, yani daha iyi bir okuyucu olmanı sağlar.",
    m1a:"Büyük sayıları okumayı birlikte öğrenelim. Bir sayıyı okurken sondan başlayarak üçlü gruplara ayırırız: önce birler grubu, sonra binler grubu, sonra milyonlar grubu. Örneğin 45.230 sayısını sondan üçe ayırınca '45' ve '230' olur; bu da 'kırk beş bin iki yüz otuz' diye okunur. Büyük bir sayı gördüğünde sağdan sola üçer üçer nokta koyarak grupları ayırmayı dene, okumak çok kolaylaşır.",
    m1b:"Basamak değerini birlikte öğrenelim. Bir rakamın değeri, sayının içinde bulunduğu basamağa göre değişir. 4536 sayısında 5 rakamı yüzler basamağındadır, bu yüzden basamak değeri 500'dür (5x100). Aynı 5 rakamı başka bir basamakta olsaydı değeri farklı olurdu. Bir rakamın basamak değerini bulmak için önce hangi basamakta olduğuna bak, sonra o basamağın değeriyle çarp.",
    m1c:"Sayıları karşılaştırmayı birlikte öğrenelim. İki sayıyı karşılaştırırken önce basamak sayılarına bakarız; basamağı fazla olan sayı her zaman daha büyüktür. Basamak sayıları eşitse, en soldaki basamaktan başlayarak rakamları teker teker karşılaştırırız, ilk farklı bulduğun yerde hangi rakam büyükse o sayı daha büyüktür.",
    m2a:"Zihinden toplama-çıkarma yapmayı birlikte öğrenelim. Zihinden işlem yaparken sayıları yuvarlayıp kolay parçalara ayırmak çok işine yarar. Mesela 48+27 işlemini yapmak için 48'i 50 yapabilirsin (2 fazladan eklemiş olursun), 50+27=77 bulursun, sonra fazladan eklediğin 2'yi çıkarırsın: 77-2=75. Bu yöntemle büyük sayıları bile kafandan hızlıca toplayabilirsin.",
    m2b:"Tahmin etmeyi birlikte öğrenelim. Bir işlemin kesin sonucunu bulmadan önce, sayıları yuvarlayarak yaklaşık bir sonuç tahmin edebiliriz. Bu hem işlemi kontrol etmene hem de günlük hayatta hızlı karar vermene yardımcı olur; mesela markette alışveriş yaparken toplam tutarı yaklaşık olarak tahmin edebilirsin.",
    m2c:"Problem çözmeyi birlikte öğrenelim. Bir problemi çözerken ilk önce sana ne verildiğini (verileri) ve senden ne istendiğini (soruyu) dikkatlice oku ve anla. Sonra hangi işlemi kullanman gerektiğine karar ver: bir şeyler birleşiyorsa toplama, bir şeyler azalıyor ya da fark bulunuyorsa çıkarma kullanırsın. Acele etmeden önce problemi iki kez okumak hata yapmanı önler.",
    m3a:"Çarpma işlemini birlikte öğrenelim. Çarpma aslında bir sayıyı belirli sayıda kendisiyle toplamaktır. 4x3 işlemi, 4'ü 3 kere toplamak demektir: 4+4+4=12. Çarpım tablosunu ezberlemek bu işlemleri çok hızlandırır, ama unutursan her zaman tekrarlı toplama yaparak da bulabilirsin.",
    m3b:"Bölme işlemini birlikte öğrenelim. Bölme, bir sayıyı eşit gruplara ayırmaktır. 12:3=4 demek, 12 tane nesneyi 3 eşit gruba ayırdığımızda her grupta 4 tane olacağı anlamına gelir. Bölmeyi kontrol etmenin kolay bir yolu var: bulduğun sonucu bölen sayıyla çarparsan, başlangıçtaki sayıyı bulmalısın (3x4=12 gibi).",
    m3c:"Çarpma-bölme ile problem çözmeyi birlikte öğrenelim. Bir problemde 'her birine kaç düşer', 'eşit paylaştırılırsa' gibi ifadeler görürsen genelde bölme yapman gerekir. 'Toplam kaç eder', 'hepsi birlikte kaç tane' gibi ifadeler görürsen genelde çarpma yapman gerekir. Problemi okurken bu ipucu kelimelere dikkat etmek doğru işlemi seçmene yardımcı olur.",
    m4a:"Kesirleri tanımayı ve karşılaştırmayı birlikte öğrenelim. Bir kesirde alttaki sayıya payda denir ve bütünün kaç eşit parçaya bölündüğünü gösterir. Üstteki sayıya pay denir ve bu parçalardan kaç tanesinin alındığını gösterir. Paydaları aynı olan iki kesri karşılaştırırken, payı büyük olan kesir her zaman daha büyüktür; çünkü aynı büyüklükteki parçalardan daha fazlasını almışsındır.",
    m4b:"Kesirlerle toplama yapmayı birlikte öğrenelim. Paydaları aynı olan kesirleri toplarken sadece payları topla, payda hiç değişmez. Örneğin 2/5 + 1/5 işleminde paylar toplanır (2+1=3), payda aynı kalır (5), sonuç 3/5 olur. Bunu şöyle düşünebilirsin: aynı büyüklükte pastalar kesildiğinde, kaç dilim aldığını sayarsın.",
    m4c:"Veri toplama ve grafik oluşturmayı birlikte öğrenelim. Etrafımızdan topladığımız bilgileri (verileri) tablo veya grafiklerle gösterebiliriz. Sütun grafiğinde her sütunun yüksekliği, o verinin büyüklüğünü gösterir; sütun ne kadar yüksekse o kadar çok demektir. Bir grafiği okurken önce eksenlerin ne anlattığına, sonra sütunların yüksekliğine bak.",
    m5a:"Açıları birlikte öğrenelim. Açılar büyüklüklerine göre isim alır: 90 dereceden küçük açılara dar açı, tam 90 derece olan açıya dik açı, 90 ile 180 derece arasındaki açılara geniş açı, tam 180 derece olan açıya ise doğru açı denir. Bir açının türünü bulmak için önce kaç derece olduğuna bak, sonra bu sınırlara göre karar ver.",
    m5b:"Üçgen, kare ve dikdörtgeni birlikte tanıyalım. Üçgenin 3 kenarı ve 3 köşesi vardır. Karenin 4 kenarı vardır ve hepsi birbirine eşit uzunluktadır. Dikdörtgenin de 4 kenarı vardır ama sadece karşılıklı kenarları birbirine eşittir. Bu şekillere bakarken kenar sayısını ve kenarların uzunluklarının birbirine eşit olup olmadığını kontrol edersen hangi şekil olduğunu bulabilirsin.",
    m5c:"Uzunluk ölçmeyi birlikte öğrenelim. Kısa mesafeleri ölçerken genelde cetvel, uzun mesafeleri ölçerken metre kullanırız. 1 metre 100 santimetreye eşittir, yani 1 metrelik bir ipi santimetre cetveliyle ölçseydin 100 çizgi sayardın. Bir şeyin uzunluğunu ölçerken cetveli sıfırdan başlatmayı unutma.",
    m6a:"Çevre hesaplamayı birlikte öğrenelim. Bir şeklin çevresi, o şeklin tüm kenarlarının toplam uzunluğudur; sanki şeklin etrafında yürüyüp kaç adım attığını ölçmek gibi düşünebilirsin. Dikdörtgende çevreyi bulmak için formül şudur: çevre = 2 x (uzun kenar + kısa kenar). Önce iki farklı kenarı topla, sonra 2 ile çarp.",
    m6b:"Alan hesaplamayı birlikte öğrenelim. Bir şeklin alanı, o şeklin kapladığı yüzey büyüklüğüdür; sanki şeklin içini kaç tane küçük kareyle doldurabileceğini düşünmek gibi. Dikdörtgende alanı bulmak için formül şudur: alan = kısa kenar x uzun kenar. Çevre ile alanı karıştırmamaya dikkat et: çevre toplama, alan ise çarpma ile bulunur.",
    m6c:"Tartma ve sıvı ölçmeyi birlikte öğrenelim. Bir şeyin ağırlığını ölçerken gram ve kilogram birimlerini, bir sıvının miktarını ölçerken mililitre ve litre birimlerini kullanırız. 1 kilogram 1000 grama, 1 litre de 1000 mililitreye eşittir. Küçük miktarlar için gram/mililitre, büyük miktarlar için kilogram/litre kullanmak daha pratiktir.",
    f1a:"Yer kabuğunu birlikte tanıyalım. Dünya'nın en dıştaki, üzerinde yaşadığımız katmanına yer kabuğu denir. Kayalar, topraklar, dağlar ve denizlerin dibi yer kabuğunun bir parçasıdır. Yer kabuğu, Dünya'nın en ince ama bizim için en önemli katmanıdır çünkü hayatımız onun üzerinde geçer.",
    f1b:"Dünya'nın hareketlerini birlikte öğrenelim. Dünya kendi ekseni etrafında döner; bu dönüş yaklaşık 24 saat sürer ve gece ile gündüzün oluşmasını sağlar, çünkü Güneş'e dönük yüzümüz aydınlıkken arka tarafımız karanlıktadır. Dünya aynı zamanda Güneş'in etrafında da döner, buna dolanma hareketi denir ve yaklaşık 1 yıl sürer; bu hareket de mevsimlerin oluşmasını sağlar.",
    f1c:"Depremi birlikte konuşalım. Yer kabuğunun altındaki hareketler bazen yer kabuğunu sarsar, buna deprem denir. Deprem sırasında güvende kalmak çok önemlidir; bunun için 'çök-kapan-tutun' kuralını uygularız: hemen yere çök, başını ve boynunu koru, sağlam bir mobilyanın altına gir ve sıkıca tutun.",
    f2a:"Besin içeriklerini birlikte öğrenelim. Yediğimiz besinler karbonhidrat, protein, yağ, vitamin ve mineral gibi farklı öğeler içerir; her biri vücudumuzda farklı bir görev üstlenir. Karbonhidratlar bize enerji verir, proteinler kaslarımızın gelişmesine yardımcı olur, vitamin ve mineraller ise vücudumuzun düzgün çalışmasını sağlar.",
    f2b:"Dengeli beslenmeyi birlikte konuşalım. Sağlıklı büyümek için tek bir besin grubuna bağlı kalmak yeterli değildir; her besin grubundan (sebze, meyve, tahıl, süt ürünleri, et) yeterli miktarda tüketmemiz gerekir. Tabağını düşün: içinde hem sebze hem tahıl hem de protein kaynağı varsa, dengeli beslendiğin bir öğün yemişsin demektir.",
    f2c:"Besinlerin saklanmasını birlikte öğrenelim. Besinleri buzdolabında, kapalı kaplarda ya da dondurucuda dondurarak saklamak, bozulmalarını geciktirir ve daha uzun süre taze kalmalarını sağlar. Açıkta bırakılan besinler daha çabuk bozulur, bu yüzden yiyecekleri her zaman uygun şekilde saklamaya özen göstermeliyiz.",
    f3a:"Kuvvetin cisimlere etkisini birlikte öğrenelim. Bir cismi itmek ya da çekmek etkisine kuvvet denir. Kuvvet uyguladığımızda bir cismi hareket ettirebiliriz, durabilen bir cismi durdurabiliriz, hareket yönünü değiştirebiliriz ya da şeklini bozabiliriz. Bir topa vurduğunda topun hareket etmesi, kuvvetin en basit örneğidir.",
    f3b:"Sürtünme kuvvetini birlikte öğrenelim. İki yüzey birbirine temas edip hareket ederken, hareketi yavaşlatan bir kuvvet oluşur, buna sürtünme kuvveti denir. Pürüzlü yüzeylerde (mesela halı üzerinde) sürtünme fazladır, bu yüzden kaymak zordur. Pürüzsüz yüzeylerde (mesela buz üzerinde) sürtünme azdır, bu yüzden kaymak kolaydır.",
    f4a:"Maddenin ölçülebilir özelliklerini birlikte öğrenelim. Maddenin kütlesi (ne kadar ağır olduğu), hacmi (ne kadar yer kapladığı) ve sıcaklığı gibi özellikleri ölçülebilir ve sayılarla ifade edilebilir. Bu özellikleri ölçmek için terazi, ölçü kabı ve termometre gibi araçlar kullanırız.",
    f4b:"Maddenin hallerini birlikte öğrenelim. Madde katı, sıvı ve gaz olmak üzere üç halde bulunabilir. Bir katıya ısı verildiğinde erir ve sıvı hale geçer; buz ısıtılınca suya dönüşür gibi. Bir sıvı daha da ısıtılırsa gaz haline geçebilir; su kaynayınca buhara dönüşür gibi. Isı alıp vermek, maddenin bir halden diğerine geçmesini sağlar.",
    f4c:"Isı ve sıcaklığı birlikte öğrenelim. Isı bir enerji türüdür ve her zaman sıcak olan yerden soğuk olan yere doğru akar; sıcak bir çayın zamanla soğuması bunun bir örneğidir. Sıcaklık ise bir cismin ne kadar sıcak ya da soğuk olduğunun ölçüsüdür ve termometreyle ölçülür. Isı bir enerjidir, sıcaklık ise bu enerjinin bir ölçüsüdür; ikisini karıştırmamaya dikkat et.",
    f5a:"Işık kaynaklarını birlikte öğrenelim. Kendiliğinden ışık üreten cisimlere ışık kaynağı denir; Güneş ve ampul buna güzel örneklerdir. Ay ise kendisi ışık üretmez, sadece Güneş'ten aldığı ışığı bize yansıtır. Bu yüzden Ay'a ışık kaynağı değil, ışığı yansıtan bir cisim deriz.",
    f5b:"Sesin özelliklerini birlikte öğrenelim. Ses, bir cismin titreşmesiyle oluşur ve bu titreşim hava, su ya da katı bir madde aracılığıyla yayılır. Boşlukta (yani hiçbir maddenin olmadığı yerde, mesela uzayda) titreşimi taşıyacak bir madde olmadığı için ses yayılamaz. Bu yüzden astronotlar uzayda birbirleriyle telsizle konuşurlar, doğrudan sesle değil.",
    f6a:"Doğal ve yapay çevreyi birlikte öğrenelim. Orman, deniz, dağ gibi kendiliğinden, insan eli değmeden var olan yerlere doğal çevre denir. Bina, yol, park gibi insanların inşa ettiği yerlere ise yapay çevre denir. Etrafına bakarken bir yerin kendiliğinden mi oluştuğunu yoksa insan yapımı mı olduğunu düşünürsen, hangisi olduğunu kolayca ayırt edebilirsin.",
    f6b:"Çevre sorunlarını birlikte konuşalım. Çöplerin doğaya rastgele atılması, hava kirliliği ve su kirliliği önemli çevre sorunlarına yol açar. Geri dönüşüm yapmak (kâğıt, plastik, cam gibi atıkları ayrı toplamak) ve doğal kaynakları tasarruflu kullanmak, bu sorunları azaltmamıza yardımcı olur. Küçük bir çocuk bile su ve elektriği tasarruflu kullanarak çevreye katkıda bulunabilir.",
    f7a:"Devre elemanlarını birlikte öğrenelim. Basit bir elektrik devresinde üç temel eleman bulunur: pil (devreye elektrik enerjisini sağlar), kablo (bu enerjiyi taşır) ve ampul (enerjiyi ışığa çevirir, yani tüketir). Bu üç eleman birbirine doğru bağlandığında ampul yanar.",
    f7b:"Seri bağlamayı birlikte öğrenelim. Devre elemanlarının art arda, tek bir yoldan bağlanmasına seri bağlama denir. Seri bağlı bir devrede bir ampul sönerse ya da devreden çıkarsa, yol kesilir ve devredeki diğer ampuller de söner; çünkü elektrik akımının akabileceği tek yol kesilmiştir.",
    s1a:"Kişisel özelliklerimizi birlikte konuşalım. Her insanın kendine has yetenekleri, ilgi alanları ve özellikleri vardır; kimi resim yapmayı sever, kimi spor yapmayı. Kendi özelliklerini tanımak, neyi iyi yaptığını ve nelerden hoşlandığını bilmek, kendini daha iyi anlamana ve kendine güvenmene yardımcı olur.",
    s1b:"Haklarımızı ve sorumluluklarımızı birlikte öğrenelim. Hak, bizim sahip olduğumuz ve kimsenin elimizden alamayacağı şeylerdir; eğitim hakkı, sağlık hakkı gibi. Sorumluluk ise bizim yerine getirmemiz gereken görevlerdir; odanı toplamak, ödevini yapmak gibi. Haklarımız olduğu kadar, yerine getirmemiz gereken sorumluluklarımız da vardır; ikisi birlikte dengeli bir yaşam oluşturur.",
    s2a:"Kültürel mirası birlikte öğrenelim. Camiler, köprüler, kaleler gibi elle tutulup gözle görülebilen, geçmişten kalan yapılara somut kültürel miras denir. Masal, türkü, oyun gibi elle tutulamayan ama nesilden nesile aktarılan değerlere ise somut olmayan kültürel miras denir. İkisi de bizim geçmişimizi ve kültürümüzü öğrenmemizde bize yardımcı olur.",
    s2b:"Yerel tarihi birlikte konuşalım. Yaşadığımız şehrin ya da köyün geçmişini araştırmak, o yerin tarihini, geleneklerini ve kültürünü öğrenmemizi sağlar. Büyüklerinle konuşarak, eski fotoğraflara bakarak ya da tarihi yerleri ziyaret ederek yaşadığın yerin geçmişini keşfedebilirsin.",
    s3a:"Harita okumayı birlikte öğrenelim. Haritalar, bir yerin kuşbakışı, yani yukarıdan bakılmış gibi küçültülerek çizilmiş halidir. Haritada yönleri gösteren işarete yön oku (pusula gülü) denir; kuzey, güney, doğu ve batıyı gösterir. Lejant ise haritadaki sembollerin ne anlama geldiğini açıklar. Bir haritayı okurken önce yön okuna, sonra lejanta bakmalısın.",
    s3b:"Yaşadığımız yeri birlikte konuşalım. Yaşadığımız yerin coğrafi özellikleri, yani dağlık mı, ovalık mı, denize yakın mı olduğu, oradaki insanların yaşam biçimini etkiler. Mesela deniz kenarında yaşayanlar balıkçılıkla uğraşabilir, dağlık bölgede yaşayanlar hayvancılıkla uğraşabilir. Yaşadığın yerin coğrafyasına bakarak oradaki insanların nasıl yaşadığını tahmin edebilirsin.",
    s4a:"Teknolojik gelişmeleri birlikte konuşalım. Zamanla gelişen teknoloji, hayatımızı kolaylaştırır ve işleri çok daha hızlı yapmamızı sağlar. Eskiden saatler süren bir iş bugün dakikalar içinde yapılabiliyor, çünkü teknoloji sürekli gelişiyor ve bize yeni araçlar sunuyor.",
    s4b:"İletişimin değişimini birlikte öğrenelim. Geçmişte insanlar mektup yazarak ya da güvercinle haber göndererek haberleşirdi ve bu günler, hatta haftalar sürebilirdi. Günümüzde ise telefon ve internet sayesinde bir mesaj saniyeler içinde dünyanın öbür ucuna ulaşabiliyor. Bu, teknolojinin iletişimi nasıl değiştirdiğinin güzel bir örneğidir.",
    s5a:"İhtiyaç ve istekleri birlikte ayırt edelim. İhtiyaçlar, yaşamak için mutlaka gerekli olan şeylerdir: yemek, su, barınak gibi. İstekler ise olmasa da yaşayabileceğimiz ama sahip olmaktan mutluluk duyduğumuz şeylerdir: yeni bir oyuncak gibi. Bir şeyi alıp almayacağına karar verirken önce 'bu bir ihtiyaç mı yoksa istek mi?' diye kendine sormak iyi bir alışkanlıktır.",
    s5b:"Bilinçli tüketici olmayı birlikte konuşalım. Bilinçli bir tüketici, alışveriş yaparken gerçekten ihtiyacı olan şeyi alır, gereksiz harcamalardan kaçınır. Özellikle yiyecek alırken son kullanma tarihine, genel olarak da ürünün kalitesine dikkat eder. Bilinçli tüketici olmak, hem parayı hem de doğal kaynakları daha iyi kullanmamızı sağlar.",
    s6a:"Yerel yönetimleri birlikte öğrenelim. Belediye, yaşadığımız şehrin temizlik, su, yol, park gibi günlük hizmetlerinden sorumlu olan yerel yönetim kurumudur. Şehrimizde gördüğümüz çöp toplama araçları, yol yapım çalışmaları ya da parklar genelde belediyenin işidir.",
    s6b:"Demokratik katılımı birlikte konuşalım. Demokraside vatandaşlar oy vererek kendi yöneticilerini seçer ve ülke ya da şehir yönetimiyle ilgili kararlara katılabilir. Bu, herkesin sesinin duyulduğu ve önemli olduğu bir yönetim biçimidir. Sen de büyüdüğünde oy kullanarak bu sürece katılabileceksin.",
    s7a:"Ülkeler arası ilişkileri birlikte öğrenelim. Ülkeler birbirleriyle ticaret yaparak mal alışverişinde bulunur, kültür ve bilim alanlarında da iş birliği yapar. Bu iş birlikleri sayesinde ülkeler birbirlerinden öğrenir ve gelişir; mesela bir ülkede bulunan bir buluş, dünyanın her yerinde kullanılabilir hale gelir.",
    s7b:"Kültürel çeşitliliği birlikte konuşalım. Dünyada birbirinden çok farklı diller, gelenekler ve yaşam biçimleri vardır; buna kültürel çeşitlilik denir. Farklı kültürleri tanımak bize hoşgörülü olmayı öğretir ve dünyayı daha geniş bir bakış açısıyla görmemizi sağlar. Farklılıklara saygı duymak, iyi bir dünya vatandaşı olmanın önemli bir parçasıdır.",
    i1a:"Let's learn together! Biriyle ilk kez tanıştığında 'Hello, my name is...' diyerek kendini tanıtabilirsin, bu 'Merhaba, benim adım...' demektir. Karşındaki kişi de kendini tanıttıktan sonra 'Nice to meet you' diyebilirsin, bu da 'Tanıştığımıza memnun oldum' anlamına gelir. Bu kalıpları ezberlersen İngilizce tanışmalar senin için çok kolay olur.",
    i2a:"Hadi vücut bölümlerini birlikte öğrenelim. İngilizcede head baş, hand el, foot ayak, eye göz demektir. Duygularımızı anlatırken de 'I am happy' (mutluyum) ya da 'I am sad' (üzgünüm) gibi basit cümleler kurabiliriz. Kendi vücudunu gösterip bu kelimeleri tekrarlarsan çok daha kolay ezberlersin.",
    i3a:"Şehirdeki yerleri ve yön tarif etmeyi birlikte öğrenelim. Hospital hastane, school okul, park park demektir. Yön tarif ederken 'turn left' sola dön, 'turn right' sağa dön, 'go straight' düz git anlamına gelir. Bir haritada bu kelimeleri kullanarak birine yol tarif edebilirsin.",
    i4a:"Vahşi hayvanları ve 'can' kelimesini birlikte öğrenelim. Lion aslan, elephant fil demektir. 'Can' kelimesi bir şeyi yapabilme yeteneğini anlatır: 'Elephants can swim' cümlesi 'Filler yüzebilir' demektir. Bir hayvanın yapabildiği bir şeyi anlatmak istediğinde 'hayvan adı + can + fiil' kalıbını kullanabilirsin.",
    i5a:"Çiftlik hayvanlarını ve 'there is/there are' kalıbını birlikte öğrenelim. Cow inek, sheep koyun demektir. 'There is' tekil bir şeyin varlığını ('There is a cow' - bir inek var), 'there are' ise çoğul şeylerin varlığını anlatır ('There are five sheep' - beş koyun var). Dikkat: sheep kelimesinin çoğulu da 'sheep'tir, 'sheeps' değildir.",
    i6a:"Evdeki odaları birlikte öğrenelim. Kitchen mutfak, bedroom yatak odası, bathroom banyo demektir. Bir şeyin nerede olduğunu anlatırken 'on' üstünde, 'in' içinde, 'under' altında anlamına gelen kelimeleri kullanırız; 'The book is on the table' cümlesi 'Kitap masanın üstünde' demektir.",
    i7a:"Okul eşyalarını ve ders adlarını birlikte öğrenelim. Pencil kalem, eraser silgi, notebook defter, bag çanta demektir. Ders adlarını söylerken 'Maths' Matematik, 'English' İngilizce demektir. 'My favourite subject is Maths' dersen 'En sevdiğim ders Matematik' demiş olursun.",
    i8a:"Günlük rutinleri ve saati birlikte öğrenelim. 'Wake up' uyanmak, 'go to school' okula gitmek demektir. Saati sorarken 'What time is it?' (Saat kaç?) diye sorarız, cevap verirken de 'It's three o'clock' (Saat üç) gibi söyleriz. Kendi günlük rutinini İngilizce anlatmaya çalışırsan bu kalıpları çok daha iyi öğrenirsin.",
    i9a:"Oyuncak ve oyun kelimelerini birlikte öğrenelim. Toy oyuncak, play oynamak, turn sıra demektir. Bir oyuna başlarken 'Let's play!' (Hadi oynayalım!) diyebilir, sıra kimde olduğunu sormak için 'Whose turn is it?' (Sıra kimde?) diye sorabilirsin. Arkadaşlarınla oyun oynarken bu ifadeleri kullanmayı deneyebilirsin.",
    d1a:"Allah inancını birlikte konuşalım. Evrendeki her şeyin bir yaratıcısı olduğuna inanılır; İslam inancına göre bu yaratıcı Allah'tır. Allah'ın tek ve eşsiz olduğuna, O'ndan başka yaratıcı olmadığına inanmaya tevhit inancı denir. Bu, İslam dininin en temel inancıdır.",
    d2a:"Kur'an-ı Kerim'in özelliklerini birlikte öğrenelim. Kur'an-ı Kerim, İslam dininin kutsal kitabıdır ve Arapça olarak indirilmiştir. Kur'an-ı Kerim 30 cüzden oluşur; okurken bu cüzler sırayla ilerler. Cüz sayısını 114 sure (bölüm) sayısıyla karıştırmamaya dikkat etmelisin, ikisi farklı şeylerdir.",
    d3a:"Hz. Muhammed'in hayatını birlikte öğrenelim. Hz. Muhammed, Mekke şehrinde doğmuş ve hayatı boyunca doğruluğu ve güvenilirliğiyle tanınmıştır; hatta insanlar ona 'el-Emin', yani güvenilir kişi derlerdi. Onun bu güzel özellikleri, bugün de bizim için iyi bir örnektir.",
    d4a:"Güzel ahlak ve değerleri birlikte konuşalım. Yardımseverlik, doğruluk, saygı gibi değerler güzel ahlakın önemli parçalarıdır. Bu değerlere uygun davranmak, hem kendimizi hem de çevremizdeki insanları mutlu eder. Günlük hayatında bu değerlere uygun davranmaya özen göstermek, iyi bir insan olmanın önemli bir adımıdır.",
    d5a:"Yardımlaşma ve paylaşmayı birlikte konuşalım. İhtiyacı olan insanlarla elimizdekileri paylaşmak, toplumda dayanışmayı ve sevgiyi güçlendirir. Küçük bir paylaşım bile (bir arkadaşınla kalemini paylaşmak gibi) aslında büyük bir değeri, yardımlaşmayı yaşatmış olursun.",
    tr1a:"Temel trafik işaretlerini birlikte öğrenelim. Trafik ışıklarında kırmızı 'dur', sarı 'hazırlan', yeşil ise 'geç' anlamına gelir. Trafik işaretleri, yollarda herkesin güvenle hareket etmesini sağlamak için konulmuştur. Bir trafik ışığı gördüğünde rengine göre ne yapman gerektiğini hemen bilmelisin.",
    tr2a:"Yayaların sorumluluklarını birlikte konuşalım. Karşıdan karşıya geçmeden önce mutlaka sağa ve sola bakıp gelen araç olmadığından emin olmalısın. Geçerken yaya geçidini (zebra geçidini) kullanmalı, yürürken de kaldırımın yola değil iç kısmına yakın tarafından yürümelisin. Bu kurallar seni araçlardan korur.",
    tr3a:"Araçta ve yolda güvenliği birlikte konuşalım. Bir araca bindiğinde her zaman emniyet kemerini takmalısın; ani bir fren ya da kaza anında seni koruyan en önemli şey odur. Araçtan inip binerken de etrafına dikkatli bakmalı, aceleyle hareket etmemelisin."

  /* ---------- math question generator (tested) ---------- */
  function numDistractors(correct, count, spread, min, exclude){
    min = min===undefined?0:min;
    const set = new Set([correct, ...(exclude||[])]);
    const startSize = set.size;
    let guard=0;
    while(set.size < startSize+count && guard<400){
      guard++;
      const d = correct + randInt(-spread, spread);
      if(d>=min && !set.has(d)) set.add(d);
    }
    const out = [...set].filter(x=>x!==correct && !(exclude||[]).includes(x));
    let filler=1;
    while(out.length<count){ const f=correct+filler*(spread+1); if(!set.has(f)){ out.push(f); set.add(f); } filler++; }
    return out.slice(0,count);
  }
  function buildMCQ(correctText, distractorTexts){
    const options = shuffle([correctText, ...distractorTexts]);
    return { opts: options, correct: options.indexOf(correctText) };
  }
  function genMath(unitId, tier){
    if(unitId==='m1'){
      const digits = tier==='kolay'?4:tier==='orta'?5:6;
      const a = randInt(Math.pow(10,digits-1), Math.pow(10,digits)-1);
      let b = randInt(Math.pow(10,digits-1), Math.pow(10,digits)-1);
      while(b===a) b = randInt(Math.pow(10,digits-1), Math.pow(10,digits)-1);
      const bigger = Math.max(a,b), smaller = Math.min(a,b);
      const q = `Aşağıdaki sayılardan hangisi daha büyüktür?\n${a} mi, ${b} mi?`;
      const distractors = numDistractors(bigger,3, Math.pow(10,digits-2)||5, 0).map(String);
      const r = buildMCQ(String(bigger), distractors);
      const explain = `İki sayının basamak sayısı aynıysa, en soldaki basamaktan başlayarak karşılaştır. ${bigger} sayısı ${smaller} sayısından daha büyüktür.`;
      return { q, opts:r.opts, correct:r.correct, explain };
    }
    if(unitId==='m2'){
      const range = tier==='kolay'?100:tier==='orta'?1000:10000;
      let a = randInt(Math.floor(range/2), range);
      let b = randInt(1, Math.floor(range/2));
      const op = Math.random()<0.5?'+':'-';
      const correct = op==='+'? a+b : a-b;
      const q = `${a} ${op} ${b} = ?`;
      const distractors = numDistractors(correct,3, Math.max(5,Math.floor(range/20)), 0).map(String);
      const r = buildMCQ(String(correct), distractors);
      const explain = op==='+'
        ? `Toplarken önce birler basamağını, sonra onlar, yüzler basamağını topla; gerekiyorsa elde aktar. ${a} + ${b} = ${correct}.`
        : `Çıkarırken büyük sayıdan küçüğü basamak basamak çıkar; yetmiyorsa bir üst basamaktan ödünç al. ${a} - ${b} = ${correct}.`;
      return { q, opts:r.opts, correct:r.correct, explain };
    }
    if(unitId==='m3'){
      if(Math.random()<0.5){
        const a = tier==='kolay'?randInt(2,9):randInt(11,99);
        const b = tier==='kolay'?randInt(10,99):tier==='orta'?randInt(10,99):randInt(100,999);
        const correct = a*b;
        const q = `${a} x ${b} = ?`;
        const distractors = numDistractors(correct,3, Math.max(10,Math.round(correct*0.1)), 0).map(String);
        const r = buildMCQ(String(correct), distractors);
        const explain = `Çarpma tekrarlı toplamadır. ${b} sayısını ${a} basamağına göre parçalara ayırıp çarp, sonra topla: ${a} x ${b} = ${correct}.`;
        return { q, opts:r.opts, correct:r.correct, explain };
      } else {
        const divisor = tier==='kolay'?randInt(2,9):randInt(2,12);
        const quotient = tier==='kolay'?randInt(2,9):tier==='orta'?randInt(10,50):randInt(50,200);
        const dividend = divisor*quotient;
        const q = `${dividend} : ${divisor} = ?`;
        const distractors = numDistractors(quotient,3, Math.max(2,Math.round(quotient*0.15)), 0).map(String);
        const r = buildMCQ(String(quotient), distractors);
        const explain = `Bölme, eşit gruplara ayırmaktır. ${dividend} sayısını ${divisor}'e böldüğümüzde her grupta ${quotient} olur, çünkü ${divisor} x ${quotient} = ${dividend}.`;
        return { q, opts:r.opts, correct:r.correct, explain };
      }
    }
    if(unitId==='m4'){
      const denom = tier==='kolay'?[3,4][randInt(0,1)]:tier==='orta'?randInt(3,8):randInt(6,12);
      if(denom>=3 && Math.random()<0.5){
        let n1=randInt(1,denom-1), n2=randInt(1,denom-1);
        while(n1===n2) n2=randInt(1,denom-1);
        const bigger=Math.max(n1,n2), smaller=Math.min(n1,n2);
        const q = `${n1}/${denom} mi yoksa ${n2}/${denom} mi daha büyüktür?`;
        const correctText = `${bigger}/${denom}`;
        const distractors = [`${smaller}/${denom}`, `${denom}/${denom}`, `${bigger}/${denom+1}`];
        const r = buildMCQ(correctText, distractors);
        const explain = `Paydaları (alttaki sayı) aynı olan kesirlerde, payı (üstteki sayı) büyük olan kesir daha büyüktür. ${bigger} > ${smaller} olduğu için ${bigger}/${denom} daha büyüktür.`;
        return { q, opts:r.opts, correct:r.correct, explain };
      } else {
        let n1=randInt(1,denom-1), n2=randInt(1, Math.max(1,denom-1-n1));
        if(n1+n2>denom) n2=Math.max(1,denom-n1-1);
        const sumN=n1+n2;
        const q = `${n1}/${denom} + ${n2}/${denom} = ?`;
        const correctText = `${sumN}/${denom}`;
        const distractors = [`${sumN+1}/${denom}`, `${sumN}/${denom*2}`, `${Math.max(1,sumN-1)}/${denom}`];
        const r = buildMCQ(correctText, distractors);
        const explain = `Paydaları aynı olan kesirleri toplarken payları toplarız, payda aynı kalır: ${n1}+${n2}=${sumN}, yani ${n1}/${denom} + ${n2}/${denom} = ${sumN}/${denom}.`;
        return { q, opts:r.opts, correct:r.correct, explain };
      }
    }
    if(unitId==='m5'){
      const pool = tier==='kolay'
        ? [{d:30,t:'Dar Açı'},{d:90,t:'Dik Açı'},{d:150,t:'Geniş Açı'}]
        : tier==='orta'
        ? [{d:45,t:'Dar Açı'},{d:90,t:'Dik Açı'},{d:120,t:'Geniş Açı'},{d:180,t:'Doğru Açı'}]
        : [{d:70,t:'Dar Açı'},{d:90,t:'Dik Açı'},{d:160,t:'Geniş Açı'},{d:180,t:'Doğru Açı'},{d:15,t:'Dar Açı'}];
      const pick = pool[randInt(0,pool.length-1)];
      const q = `${pick.d}° açısı ne tür bir açıdır?`;
      const allTypes = ['Dar Açı','Dik Açı','Geniş Açı','Doğru Açı'];
      const distractors = allTypes.filter(t=>t!==pick.t).slice(0,3);
      const r = buildMCQ(pick.t, distractors);
      const explain = `90°'den küçük açılar dar açı, tam 90° dik açı, 90°-180° arası geniş açı, tam 180° ise doğru açıdır. ${pick.d}° bu kurala göre ${pick.t.toLowerCase()}dır.`;
      return { q, opts:r.opts, correct:r.correct, explain };
    }
    if(unitId==='m6'){
      const w = tier==='kolay'?randInt(3,9):tier==='orta'?randInt(4,20):randInt(10,40);
      const h = tier==='kolay'?randInt(3,9):tier==='orta'?randInt(4,20):randInt(10,40);
      const askArea = Math.random()<0.5;
      const perimeter = 2*(w+h), area = w*h;
      const q = askArea ? `Kenar uzunlukları ${w} cm ve ${h} cm olan dikdörtgenin alanı kaç cm²'dir?`
                         : `Kenar uzunlukları ${w} cm ve ${h} cm olan dikdörtgenin çevresi kaç cm'dir?`;
      const correct = askArea?area:perimeter;
      const wrongFormula = askArea?perimeter:area;
      const usedAsWrong = wrongFormula!==correct;
      const needed = usedAsWrong?2:3;
      const excl = usedAsWrong?[wrongFormula]:[];
      const others = numDistractors(correct, needed, Math.max(2,Math.round(correct*0.1)), 0, excl).map(String);
      const distractors = usedAsWrong ? [String(wrongFormula), ...others] : others;
      const r = buildMCQ(String(correct), distractors);
      const explain = askArea
        ? `Dikdörtgenin alanı = kısa kenar x uzun kenar. ${w} x ${h} = ${area} cm².`
        : `Dikdörtgenin çevresi = tüm kenarların toplamı = 2 x (kenar + kenar). 2 x (${w} + ${h}) = ${perimeter} cm.`;
      return { q, opts:r.opts, correct:r.correct, explain };
    }
    return null;
  }

  function todayDayIndex(){ return (new Date().getDay()+6)%7; }
  function nextTopicForSubject(subjectId){
    const topics = ALL_TOPICS.filter(t=>t.subjectId===subjectId);
    const tekrar = topics.find(t=>statusOf(subjectId,t.topicId)==='tekrar');
    if(tekrar) return tekrar;
    return topics.find(t=>{ const st=statusOf(subjectId,t.topicId); return st==='yok'||st==='ogreniliyor'; }) || null;
  }
  function weekMonday(){
    const d = new Date(); const idx = todayDayIndex();
    d.setDate(d.getDate()-idx); d.setHours(0,0,0,0);

  function studiedThisWeekSubjects(){
    const monday = weekMonday();
    const set = new Set();
    Object.values(state.progress).forEach(p=>{ if(p.updatedAt && new Date(p.updatedAt) >= monday) set.add(p.subjectId); });
    return set;
  }
  function dueSubjectsSoFar(){
    const idx = todayDayIndex();
    const due = new Set();
    for(let i=0;i<=idx;i++){ const day=WEEKLY_PLAN[i]; if(!day.review) day.subjects.forEach(s=>due.add(s)); }
    return due;
  }
  function missedThisWeek(){

  function fmtDayMonth(d){ return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'); }

  function computeWeeklyReport(){
    const monday = weekMonday();
    const mondayStr = monday.toISOString().slice(0,10);
    const learned = [], tekrar = [];
    const bySubject = {};
    ALL_TOPICS.forEach(t=>{
      const p = state.progress[t.subjectId+'__'+t.topicId];
      if(!p || !p.updatedAt || new Date(p.updatedAt) < monday) return;
      if(p.status==='ogrenildi'){ learned.push(t); bySubject[t.subjectId] = (bySubject[t.subjectId]||0)+1; }
      else if(p.status==='tekrar'){ tekrar.push(t); }
    });
    const quizzes = state.stats.quizHistory.filter(q=>q.date>=mondayStr);
    const avgScore = quizzes.length ? Math.round(quizzes.reduce((s,q)=>s+q.pct,0)/quizzes.length) : null;
    let minutes = 0, daysActive = 0;
    Object.keys(state.sessions).forEach(d=>{ if(d>=mondayStr && state.sessions[d]>0){ minutes += state.sessions[d]; daysActive++; } });
    const redemptions = (state.stats.redemptions||[]).filter(r=>r.date>=mondayStr);
    return { monday, learned, tekrar, bySubject, quizzes, avgScore, minutes, daysActive, redemptions };
  }

  /* ---------- weekly quiz building ---------- */
  function recentlyStudiedUnits(){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    const units = new Map(); // unitId -> subjectId
    Object.values(state.progress).forEach(p=>{
      if((p.status==='ogrenildi'||p.status==='tekrar') && new Date(p.updatedAt) >= cutoff){
        const topicMeta = ALL_TOPICS.find(t=>t.subjectId===p.subjectId && t.topicId===p.topicId);
        if(topicMeta) units.set(topicMeta.unitId, topicMeta.subjectId);
      }
    });
    return units; // Map unitId -> subjectId
  }
  function anyStudiedUnits(){
    const units = new Map();
    Object.values(state.progress).forEach(p=>{
      if(p.status==='ogrenildi'||p.status==='tekrar'){
        const topicMeta = ALL_TOPICS.find(t=>t.subjectId===p.subjectId && t.topicId===p.topicId);
        if(topicMeta) units.set(topicMeta.unitId, topicMeta.subjectId);
      }
    });
    return units;
  }
  const QUIZ_QUESTION_COUNT = 20;

  function buildQuiz(subjectFilter){
    let unitsMap;
    if(subjectFilter && subjectFilter!=='all'){
      unitsMap = new Map();
      const subj = SUBJECT_BY_ID[subjectFilter];
      if(subj) subj.units.forEach(u=>unitsMap.set(u.id, subjectFilter));
    } else {
      unitsMap = recentlyStudiedUnits();
      if(unitsMap.size===0) unitsMap = anyStudiedUnits();
    }
    if(unitsMap.size===0) return null;
    const unitIds = shuffle([...unitsMap.keys()]);
    const targetCount = QUIZ_QUESTION_COUNT;
    const questions = [];
    const usedNonMathTexts = new Set();
    let i=0, guard=0;
    while(questions.length < targetCount && guard < targetCount*6){
      guard++;
      const unitId = unitIds[i % unitIds.length]; i++;
      const subjectId = unitsMap.get(unitId);
      const level = state.levels[subjectId] || 1;
      const tier = tierWord(level);
      if(subjectId==='matematik'){
        const g = genMath(unitId, tier);
        if(g) questions.push({ subjectId, unitId, q:g.q, opts:g.opts, correct:g.correct, explain:g.explain });
      } else {
        const bank = QUESTIONS[unitId] || [];
        let pool = bank.filter(b=>b.tier===tier || tier==='kolay');
        if(pool.length===0) pool = bank;
        const avail = pool.filter(b=>!usedNonMathTexts.has(b.q));
        const chosen = (avail.length?avail:pool)[randInt(0, (avail.length?avail:pool).length-1)];
        if(chosen){
          usedNonMathTexts.add(chosen.q);
          questions.push({ subjectId, unitId, q:chosen.q, opts:chosen.opts, correct:chosen.correct, explain:chosen.explain, type:chosen.type, answers:chosen.answers });
        }
      }
    }
    if(questions.length===0) return null;
    return { questions, idx:0, answers:new Array(questions.length).fill(null) };
  }

  function submitQuiz(){
    const quiz = state.quiz;
    const perSubject = {}; // subjectId -> {correct,total}
    const missedUnits = new Set();
    quiz.questions.forEach((q,i)=>{
      perSubject[q.subjectId] = perSubject[q.subjectId] || {correct:0, total:0};
      perSubject[q.subjectId].total++;
      if(answerIsCorrect(q, quiz.answers[i])) perSubject[q.subjectId].correct++;
      else missedUnits.add(q.subjectId+'::'+q.unitId);
    });
    const totalCorrect = quiz.questions.filter((q,i)=>answerIsCorrect(q, quiz.answers[i])).length;
    const pct = Math.round(totalCorrect/quiz.questions.length*100);
    const writtenCorrectNow = quiz.questions.filter((q,i)=>q.type==='yazili' && answerIsCorrect(q, quiz.answers[i])).length;
    state.stats.writtenCorrect = (state.stats.writtenCorrect||0) + writtenCorrectNow;
    Object.keys(perSubject).forEach(subjectId=>{
      const {correct,total} = perSubject[subjectId];
      const subjPct = correct/total*100;
      const curLevel = state.levels[subjectId]||1;
      let newLevel = curLevel;
      if(subjPct>=85) newLevel = Math.min(3, curLevel+1);
      else if(subjPct<50) newLevel = Math.max(1, curLevel-1);
      if(newLevel!==curLevel) writeLevel(subjectId, newLevel);
    });
    // Yanlış cevaplanan ünitelerdeki "öğrenildi" konularını "tekrar gerekli" yap,
    // böylece konu anlatımı ve soru tekrar sınava geri döner.
    missedUnits.forEach(key=>{
      const [subjectId, unitId] = key.split('::');
      ALL_TOPICS.filter(t=>t.subjectId===subjectId && t.unitId===unitId).forEach(t=>{
        if(statusOf(subjectId, t.topicId)==='ogrenildi') setStatus(subjectId, t.topicId, 'tekrar');
      });
    });
    const missed = [];
    const seenQ = new Set();
    quiz.questions.forEach((q,i)=>{
      if(!answerIsCorrect(q, quiz.answers[i]) && !seenQ.has(q.q)){
        seenQ.add(q.q);
        missed.push({ subjectId:q.subjectId, q:q.q, correctText:correctAnswerText(q), explain:q.explain });
      }
    });
    state.stats.quizHistory = state.stats.quizHistory.slice(-19).concat([{ date:todayStr(), pct, count:quiz.questions.length }]);
    const earned = totalCorrect*5 + (pct>=80?20:0);
    addPoints(earned);
    markActiveToday(0);
    quiz.finished = true;
    quiz.score = { totalCorrect, pct, earned };
    quiz.missed = missed;
    render();
  }
