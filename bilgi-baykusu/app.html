          <div class="unit-block">
            <h3>Sınav Zorluğu</h3>
            <div class="muted" style="margin-bottom:8px">Sınav sonuçlarına göre otomatik ayarlanır, ama istersen kendin de değiştirebilirsin.</div>
            <div class="toggle-4">
              ${['kolay','orta','zor'].map((tw,i)=>{
                const lvl = i+1; const cur = state.levels[s.id]||1;
                return `<button class="${cur===lvl?'on':''}" style="${cur===lvl?('background:'+iconColorVar(s.id)+';'):''}" data-action="set-level" data-subject="${s.id}" data-level="${lvl}">${tw==='kolay'?'😊 Kolay':tw==='orta'?'🙂 Orta':'💪 Zor'}</button>`;
              }).join('')}
            </div>
          </div>
          ${unitsHTML}
        </div>`;
    }
    const tiles = CURRICULUM.map(s=>{
      const p = subjectProgress(s.id);
      return `<button class="subj-tile" data-action="open-subject" data-subject="${s.id}">
          <span class="ic">${s.icon}</span>
          <span class="nm">${esc(s.name)}</span>
          <div class="bar"><i style="width:${p.pct}%; background:${iconColorVar(s.id)}"></i></div>
          <span class="pct">${p.learned}/${p.total} konu · %${p.pct}</span>
        </button>`;
    }).join('');
    return `<div class="card"><h2>Derslerim</h2><div class="grid-subjects">${tiles}</div></div>`;
  }

  function renderQuiz(){
    if(state.quiz && !state.quiz.finished){
      const q = state.quiz;
      const cur = q.questions[q.idx];
      const progDots = q.questions.map((_,i)=>`<i class="${i<=q.idx?'done':''}"></i>`).join('');
      const selected = q.answers[q.idx];
      const answered = selected!=null;
      const isCorrect = answered && answerIsCorrect(cur, selected);
      let bodyHTML;
      if(cur.type==='yazili'){
        bodyHTML = `
          <input class="text-answer" type="text" placeholder="Cevabını buraya yaz..." value="${answered?esc(selected):''}" ${answered?'disabled':''} autocomplete="off">
          ${!answered ? `
            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="btn" data-action="submit-text-answer">Cevapla</button>
              ${sttAvailable ? `<button class="btn secondary" data-action="voice-input" id="mic-btn">${state.micListening?'🔴 Dinliyorum...':'🎤 Sesle Söyle'}</button>` : ''}
            </div>` : ''}`;
      } else {
        bodyHTML = `<div class="opts">${cur.opts.map((o,i)=>{
          let cls = '';
          if(answered){ if(i===cur.correct) cls='correct'; else if(i===selected) cls='wrong'; }
          return `<button class="opt ${cls}" data-action="answer" data-i="${i}" ${answered?'disabled':''}>${esc(o)}</button>`;
        }).join('')}</div>`;
      }
      const subj = SUBJECT_BY_ID[cur.subjectId];
      const speakBtn = ttsAvailable ? `<button class="btn secondary" data-action="speak-quiz-q" style="padding:5px 10px;font-size:11px">🔊 Dinle</button>` : '';
      const explainHTML = answered
        ? `<div class="explain-box">${isCorrect?'✅ Doğru!':'❌ Doğru cevap: <b>'+esc(correctAnswerText(cur))+'</b>'} ${cur.explain?('<br>💡 '+esc(cur.explain)):''} ${ttsAvailable&&cur.explain?`<div style="margin-top:8px"><button class="btn secondary" data-action="speak-explain" style="padding:5px 10px;font-size:11px">🔊 Açıklamayı Dinle</button></div>`:''}</div>`
        : '';
      return `
        <div class="card">
          <div class="qprog">${progDots}</div>
          <div class="muted" style="margin-bottom:6px">${subj.icon} ${esc(subj.name)} · Soru ${q.idx+1}/${q.questions.length}${cur.type==='yazili'?' · ✍️ Yazılı':''}</div>
          <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:14px">
            <div class="q-text" style="margin-bottom:0;flex:1">${esc(cur.q)}</div>
            ${speakBtn}
          </div>
          ${bodyHTML}
          ${explainHTML}
          <div style="margin-top:16px;display:flex;justify-content:flex-end">
            <button class="btn" data-action="next-question" ${!answered?'disabled':''}>${q.idx===q.questions.length-1?'Bitir':'Sonraki'} →</button>
          </div>
        </div>`;
    }
    if(state.quiz && state.quiz.finished){
      const {totalCorrect, pct, earned} = state.quiz.score;
      const msg = pct>=80?'Harikasın! 🎉': pct>=50?'Güzel gidiyorsun! 💪':'Birlikte tekrar edelim! 📚';
      const missed = state.quiz.missed || [];
      const reviewHTML = missed.length ? `
        <div class="card">
          <h2>📖 Tekrar Edelim</h2>
          <div class="muted" style="margin-bottom:10px">Karıştırdığın sorular ilgili konular "Tekrar Gerekli" olarak işaretlendi; bir dahaki sınavda tekrar karşına çıkacak.</div>
          <div style="display:flex;flex-direction:column;gap:12px">
            ${missed.map(m=>`
              <div class="topic-row" style="flex-direction:column;align-items:stretch;gap:4px">
                <span class="tname">${SUBJECT_BY_ID[m.subjectId].icon} ${esc(m.q)}</span>
                <div class="explain-box" style="margin-top:0">✅ Doğru cevap: <b>${esc(m.correctText)}</b>${m.explain?('<br>💡 '+esc(m.explain)):''}</div>
              </div>`).join('')}
          </div>
        </div>` : '';
      return `
        <div class="card" style="text-align:center">
          ${pct>=60 ? renderConfetti(pct>=80?28:16) : ''}
          <div style="font-size:52px">${pct>=80?'🏆':pct>=50?'🙂':'🌱'}</div>
          <div class="result-score">${pct}%</div>
          <div class="result-sub">${totalCorrect}/${state.quiz.questions.length} doğru · +${earned} puan</div>
          <div class="muted" style="margin-top:8px">${msg}</div>
          <button class="btn" style="margin-top:18px" data-action="quiz-done">Tamam</button>
        </div>
        ${reviewHTML}`;
    }
    if(state.quizLoading){
      return `<div class="card empty">
          <div class="big">🦉</div>
          <b>Sorular hazırlanıyor...</b>
          <div class="muted">Bilgi Baykuşu sana özel yeni sorular yazıyor, birkaç saniye sürebilir.</div>
        </div>`;
    }
    const unitsMap = recentlyStudiedUnits();
    const fallbackMap = unitsMap.size? unitsMap : anyStudiedUnits();
    const mixedReady = fallbackMap.size>0;
    return `
      <div class="card empty">
        <div class="big">🦉</div>
        <b>Günlük Sınav Zamanı!</b>
        <div class="muted">İstediğin dersten ${QUIZ_QUESTION_COUNT} soruluk bir sınav yapabilirsin, her gün istediğin kadar.</div>
      </div>
      ${aiReady()?`
      <div class="card">
        <h2>🤖 Yapay Zekâ Soruları</h2>
        <div class="muted" style="margin-bottom:10px">Açık olduğunda sınavdaki soruların bir kısmı her seferinde yeniden yazılır, yani hiç aynı sınavı iki kez çözmezsin.</div>
        <div class="toggle-4">
          <button class="${state.useAI?'on':''}" style="${state.useAI?'background:var(--green);':''}" data-action="toggle-ai" data-on="1">✅ Açık</button>
          <button class="${!state.useAI?'on':''}" style="${!state.useAI?'background:var(--ink-soft);':''}" data-action="toggle-ai" data-on="0">Kapalı</button>
        </div>
      </div>`:''}
      <div class="card">
        <h2>Karışık Sınav</h2>
        <div class="muted" style="margin-bottom:10px">${mixedReady? 'Bu hafta çalıştığın derslerden karışık sorular gelir.' : 'Karışık sınav için önce en az bir konu öğrenmelisin.'}</div>
        <button class="btn block" data-action="start-quiz" data-subject="all" ${mixedReady?'':'disabled'}>🎲 Karışık Sınava Başla</button>
      </div>
      <div class="card">
        <h2>Ders Sınavı</h2>
        <div class="muted" style="margin-bottom:10px">İstediğin dersten sınav yapabilirsin, o dersi daha önce çalışmış olman gerekmez.</div>
        <div class="grid-subjects">
          ${CURRICULUM.map(s=>`<button class="subj-tile" data-action="start-quiz" data-subject="${s.id}">
              <span class="ic">${s.icon}</span>
              <span class="nm">${esc(s.name)}</span>
            </button>`).join('')}
        </div>
      </div>`;
  }

  function renderParentLock(){
    const dots = Array.from({length:4}).map((_,i)=>`<i class="${i<state.pinInput.length?'filled':''}"></i>`).join('');
    return `
      <div class="card" style="text-align:center">
        <div style="font-size:36px">🔒</div>
        <h2 style="margin-top:6px">Veli Paneli</h2>
        <div class="muted">Devam etmek için PIN gir (varsayılan: 0000)</div>
        <div class="pindots">${dots}</div>
        <div class="pinpad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-action="pin-key" data-k="${n}">${n}</button>`).join('')}
          <button data-action="pin-clear">Temizle</button>
          <button data-action="pin-key" data-k="0">0</button>
          <button data-action="pin-back">⌫</button>
        </div>
      </div>`;
  }

  function renderRewardsAdmin(){
    const rewards = sortedRewards();
    const rows = rewards.map(r=>`
        <div class="reward-item">
          <span class="em">${r.emoji}</span>
          <div class="info"><div class="nm">${esc(r.name)}</div><div class="cost">${r.cost} puan</div></div>
          <button class="btn secondary" data-action="delete-reward" data-id="${r.id}">Sil</button>
        </div>`).join('') || `<div class="muted">Henüz ödül eklenmedi.</div>`;
    const log = (state.stats.redemptions||[]).slice().reverse();
    const logHTML = log.length
      ? log.map(r=>`<div>${r.date} · ${r.emoji||'🎁'} ${esc(r.name)} · ${r.cost} puan</div>`).join('')
      : `<div class="muted">Henüz kullanılan ödül yok.</div>`;
    return `
      <div class="card">
        <h2>Ödüller</h2>
        <div class="muted" style="margin-bottom:10px">Puan biriktirince kullanabileceği ödülleri sen belirlersin. Örnek: 15 dakika tablet, hafta sonu film gecesi.</div>
        <div class="reward-list">${rows}</div>
        <form class="reward-form" data-action-submit="add-reward">
          <input name="rname" placeholder="Ödül adı (örn. Film Gecesi)" required>
          <input name="remoji" placeholder="🎁" value="🎁">
          <input name="rcost" type="number" min="1" placeholder="Puan" required>
          <button class="btn" type="submit">Ekle</button>
        </form>
      </div>
      <div class="card">
        <h2>Kullanılan Ödüller</h2>
        <div class="redeem-log">${logHTML}</div>
        ${log.length ? `<button class="btn secondary" style="margin-top:10px" data-action="clear-redemptions">Geçmişi Temizle</button>` : ''}
      </div>`;
  }

  function renderParentPanel(){
    const total = ALL_TOPICS.length;
    const learned = learnedCountTotal();
    const weekMap = recentlyStudiedUnits();
    const levelRows = CURRICULUM.map(s=>{
      const lvl = state.levels[s.id]||1;
      return `<div class="topic-row"><span class="tname">${s.icon} ${esc(s.name)}</span><span class="status-pill">${tierWord(lvl)} seviye</span></div>`;
    }).join('');
    const subjectEditors = CURRICULUM.map(s=>{
      const unitsHTML = s.units.map(u=>{
        const rows = u.topics.map(t=>{
          const st = statusOf(s.id,t.id);
          const btns = STATUS_ORDER.map(key=>`<button class="${st===key?'on':''}" style="${st===key?('background:'+STATUS_META[key].color+';'):''}" data-action="set-status" data-subject="${s.id}" data-topic="${t.id}" data-status="${key}">${STATUS_META[key].label}</button>`).join('');
          return `<div class="topic-row" style="flex-direction:column;align-items:stretch;gap:6px">
              <span class="tname">${esc(t.name)}</span>
              <div class="toggle-4">${btns}</div>
            </div>`;
        }).join('');
        return `<div class="unit-block"><h3>${esc(u.name)}</h3><div class="topics">${rows}</div></div>`;
      }).join('');
      return `<details style="margin-bottom:10px">
          <summary style="cursor:pointer;font-weight:800;padding:8px 0">${s.icon} ${esc(s.name)}</summary>
          ${unitsHTML}
        </details>`;
    }).join('');
    const journalEntries = Object.entries(state.journal).filter(([,t])=>t&&t.trim()).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5);
    const journalHTML = journalEntries.length ? journalEntries.map(([date,text])=>`
        <div class="topic-row" style="flex-direction:column;align-items:stretch;gap:4px">
          <span class="tname">${date}</span>
          <div class="muted">${esc(text)}</div>
        </div>`).join('') : `<div class="muted">Henüz günlük notu yazılmadı.</div>`;
    return `
      ${renderWeeklyReportCard()}
      <div class="card">
        <h2>📔 Günlük Notları</h2>
        <div class="muted" style="margin-bottom:10px">Kızınızın "Bugün Ne Öğrendim?" bölümüne yazdığı son notlar.</div>
        <div class="topics">${journalHTML}</div>
      </div>
      <div class="card">
        <h2>Genel Durum</h2>
        <div class="muted">${learned}/${total} konu öğrenildi (toplam) · Bu hafta ${weekMap.size} ünite çalışıldı</div>
      </div>
      <div class="card">
        <h2>Ders Seviyeleri (Sınav Zorluğu)</h2>
        <div class="topics">${levelRows}</div>
        <div class="muted" style="margin-top:8px">Sınav başarısına göre otomatik güncellenir.</div>
      </div>
      <div class="card">
        <h2>Konu Durumlarını Düzenle</h2>
        ${subjectEditors}
      </div>
      ${renderRewardsAdmin()}
      <div class="card">
        <h2>Ayarlar</h2>
        <button class="btn secondary" data-action="change-pin">PIN Değiştir</button>
        <button class="btn secondary" style="margin-left:8px" data-action="reset-progress">Tüm İlerlemeyi Sıfırla</button>
        <button class="btn secondary" style="margin-left:8px" data-action="lock-parent">Kilitle</button>
      </div>
    `;
  }

  function render(){
    let body = '';
    if(state.view==='home') body = renderHome();
    else if(state.view==='subjects') body = renderSubjects();
    else if(state.view==='quiz') body = renderQuiz();
    else if(state.view==='ask') body = renderAsk();
    else if(state.view==='parent') body = state.parentUnlocked ? renderParentPanel() : renderParentLock();
    app.innerHTML = renderHeader() + body;
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(action==='nav'){ state.view = el.dataset.view; state.openSubject=null; render(); }
    else if(action==='open-subject'){ state.openSubject = el.dataset.subject; render(); }
    else if(action==='pick-subject'){ state.chosenSubject = el.dataset.subject; render(); }
    else if(action==='cycle-theme'){ cycleTheme(); }
    else if(action==='open-badge'){ state.openBadge = el.dataset.id; render(); }
    else if(action==='close-badge'){ state.openBadge = null; render(); }
    else if(action==='close-subject'){ state.openSubject = null; state.openLesson = null; render(); }
    else if(action==='toggle-lesson'){ state.openLesson = state.openLesson===el.dataset.key ? null : el.dataset.key; render(); }
    else if(action==='complete-topic'){
      setStatus(el.dataset.subject, el.dataset.topic, 'ogrenildi');
      addPoints(10);
      markActiveToday(0);
    }
    else if(action==='start-timer'){
      state.timer.running = true; state.timer.seconds = 0;
      state.timer.handle = setInterval(()=>{ state.timer.seconds++; render(); }, 1000);
      render();
    }
    else if(action==='stop-timer'){
      clearInterval(state.timer.handle);
      const minutes = Math.max(1, Math.round(state.timer.seconds/60));
      state.timer.running = false;
      markActiveToday(minutes);
      addPoints(minutes>=20?15:5);
      render();
    }
    else if(action==='start-quiz'){
      if(el.disabled) return;
      startQuiz(el.dataset.subject);
    }
    else if(action==='toggle-ai'){ state.useAI = el.dataset.on==='1'; render(); }
    else if(action==='ask-teacher'){
      const ta = app.querySelector('#ask-input');
      askTeacher(ta ? ta.value : '');
    }
    else if(action==='ask-suggestion'){ askTeacher(ASK_SUGGESTIONS[Number(el.dataset.i)]); }
    else if(action==='ask-voice'){
      if(!sttAvailable || state.micListening) return;
      state.micListening = true;
      render();
      startVoiceInput(
        (text)=>{ const ta = app.querySelector('#ask-input'); if(ta) ta.value = text; },
        ()=>{ state.micListening = false; render(); }
      );
    }
    else if(action==='speak-ai'){ speak(state.ai.answer || ''); }
    else if(action==='explain-again'){
      const name = el.dataset.topic || '';
      askTeacher(`"${name}" konusunu bana başka bir örnekle, daha basit anlatır mısın?`);
    }
    else if(action==='answer'){
      if(state.quiz) state.quiz.answers[state.quiz.idx] = Number(el.dataset.i);
      render();
    }
    else if(action==='submit-text-answer'){
      const input = app.querySelector('.text-answer');
      const val = input ? input.value.trim() : '';
      if(!val || !state.quiz) return;
      state.quiz.answers[state.quiz.idx] = val;
      render();
    }
    else if(action==='voice-input'){
      if(!sttAvailable || state.micListening) return;
      state.micListening = true;
      render();
      startVoiceInput(
        (text)=>{ const input = app.querySelector('.text-answer'); if(input) input.value = text; },
        ()=>{ state.micListening = false; render(); }
      );
    }
    else if(action==='print-report'){
      const el2 = document.getElementById('print-report');
      if(el2) el2.innerHTML = buildPrintReportHTML();
      setTimeout(()=>{ try{ window.print(); }catch(e){} }, 60);
    }
    else if(action==='speak-quiz-q'){
      if(!state.quiz) return;
      const cur = state.quiz.questions[state.quiz.idx];
      const text = cur.type==='yazili' ? cur.q : (cur.q + '. Seçenekler: ' + cur.opts.join(', '));
      speak(text);
    }
    else if(action==='speak-explain'){
      if(!state.quiz) return;
      speak(state.quiz.questions[state.quiz.idx].explain || '');
    }
    else if(action==='speak-lesson'){
      speak(TOPIC_LESSONS[el.dataset.key] || '');
    }
    else if(action==='next-question'){
      const q = state.quiz;
      if(q.idx < q.questions.length-1){ q.idx++; render(); }
      else { submitQuiz(); }
    }
    else if(action==='quiz-done'){ state.quiz=null; state.view='home'; render(); }
    else if(action==='pin-key'){
      if(state.pinInput.length<4) state.pinInput += el.dataset.k;
      if(state.pinInput.length===4){
        if(state.pinInput===state.settings.pin){ state.parentUnlocked=true; state.pinInput=''; }
        else { state.pinInput=''; }
      }
      render();
    }
    else if(action==='pin-back'){ state.pinInput = state.pinInput.slice(0,-1); render(); }
    else if(action==='pin-clear'){ state.pinInput=''; render(); }
    else if(action==='set-status'){ setStatus(el.dataset.subject, el.dataset.topic, el.dataset.status); }
    else if(action==='set-level'){ writeLevel(el.dataset.subject, Number(el.dataset.level)); render(); }
    else if(action==='save-journal'){
      const ta = app.querySelector('#journal-textarea');
      const text = ta ? ta.value.trim() : '';
      writeJournal(todayStr(), text);
      el.textContent = '✅ Kaydedildi';
      setTimeout(()=>{ if(el.isConnected) el.textContent='💾 Kaydet'; }, 1500);
    }
    else if(action==='lock-parent'){ state.parentUnlocked=false; render(); }
    else if(action==='change-pin'){
      const np = prompt('Yeni 4 haneli PIN girin:');
      if(np && /^[0-9]{4}$/.test(np)){ state.settings.pin = np; writeSettings(); alert('PIN güncellendi.'); }
    }
    else if(action==='reset-progress'){
      if(confirm('Tüm ilerleme ve puanlar silinsin mi? Bu işlem geri alınamaz.')){
        const progressKeys = Object.keys(state.progress);
        const levelKeys = Object.keys(state.levels);
        state.progress = {}; state.stats = { points:0, streak:0, lastActiveDate:null, quizHistory:[], redemptions:[], writtenCorrect:0 }; state.levels={};
        writeStats();
        render();
        if(state.db){
          progressKeys.forEach(k=>{ state.db.doc('progress/'+k).delete().catch(()=>{}); });
          levelKeys.forEach(k=>{ state.db.doc('levels/'+k).delete().catch(()=>{}); });
        }
      }
    }
    else if(action==='redeem-reward'){
      const reward = state.rewards.find(r=>r.id===el.dataset.id);
      if(reward) redeemReward(reward);
    }
    else if(action==='delete-reward'){ deleteReward(el.dataset.id); }
    else if(action==='clear-redemptions'){ clearRedemptionLog(); }
  });

  app.addEventListener('submit', function(e){
    const form = e.target.closest('[data-action-submit]');
    if(!form) return;
    e.preventDefault();
    if(form.dataset.actionSubmit==='add-reward'){
      const name = form.elements.rname.value.trim();
      const emoji = form.elements.remoji.value.trim() || '🎁';
      const cost = Number(form.elements.rcost.value);
      if(name && cost>0){ addReward(name, emoji, cost); }
    }
  });

  app.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.classList.contains('text-answer')){
      e.preventDefault();
      const btn = app.querySelector('[data-action="submit-text-answer"]');
      if(btn) btn.click();
    }
  });

  /* ---------- boot ---------- */
  async function boot(){
    loadTheme();
    try{
      if(window.claude && window.claude.use){
        state.db = await window.claude.use('db');
      }
    }catch(err){ state.db = null; }

    // Yapay zekâ öğretmen: yoksa uygulama aynen çalışmaya devam eder, ilgili butonlar görünmez.
    try{
      if(window.claude && window.claude.use){
        sampleFn = await window.claude.use('sample');
      }
    }catch(err){ sampleFn = null; }

    if(state.db){
      try{
        const [progressSnap, levelsSnap, statsDoc, settingsDoc, sessionsSnap, rewardsSnap, journalSnap] = await Promise.all([
          state.db.collection('progress').get(),
          state.db.collection('levels').get(),
          state.db.doc('meta/stats').get(),
          state.db.doc('meta/settings').get(),
          state.db.collection('sessions').get(),
          state.db.collection('rewards').get(),
          state.db.collection('journal').get()
        ]);
        progressSnap.docs.forEach(d=>{ state.progress[d.id] = d.data(); });
        levelsSnap.docs.forEach(d=>{ const data=d.data(); if(data && data.level) state.levels[d.id]=data.level; });
        if(statsDoc.exists){ state.stats = { points:0, streak:0, lastActiveDate:null, quizHistory:[], redemptions:[], writtenCorrect:0, ...statsDoc.data() }; }
        if(settingsDoc.exists){ state.settings = { pin:'0000', ...settingsDoc.data() }; }
        sessionsSnap.docs.forEach(d=>{ const data=d.data(); state.sessions[d.id] = (data&&data.minutes)||0; });
        journalSnap.docs.forEach(d=>{ const data=d.data(); state.journal[d.id] = (data&&data.text)||''; });
        if(rewardsSnap.docs.length){
          state.rewards = rewardsSnap.docs.map(d=>({ id:d.id, ...d.data() }));
        } else {
          state.rewards = REWARD_DEFAULTS.map((r,i)=>({ id:'seed'+i, ...r }));
          state.rewards.forEach(r=>{ state.db.collection('rewards').doc(r.id).set({ name:r.name, emoji:r.emoji, cost:r.cost }).catch(()=>{}); });
        }
      }catch(err){ /* render with whatever we have */ }
    } else {
      state.rewards = REWARD_DEFAULTS.map((r,i)=>({ id:'seed'+i, ...r }));
    }
    render();
  }
  boot();
})();
</script>
